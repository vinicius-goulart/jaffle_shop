version: 2

macros:
  - name: cents_to_dollars
    description: "Converts a column value from cents to dollars (divides by 100)"
    arguments:
      - name: column_name
        type: string
        description: "The name of the column containing the dollar amount in cents"
      - name: decimals
        type: integer
        description: "The nunber of decimal places to round the output to (default: 2)"
  
  - name: grant_select
    description: "Grants SELECT permissions on all tables and views in a specified schema to a target role or user."
    arguments:
      - name: schema
        type: string
        description: "The target schema where SELECT permissions will be granted (defaults to the active target schema)."
      - name: role
        type: string
        description: "The database role or user receiving the SELECT permissions."